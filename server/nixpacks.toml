# Nixpacks config for the Fastify API (Dokploy app #2).
#
# Built from /server. Pairs with the SPA app (see ../nixpacks.toml).
# On boot, the server auto-applies pending migrations (`MIGRATE_ON_BOOT=true`)
# and optionally seeds (`SEED_ON_BOOT=true`) — both flags are env-controlled
# and recommended to be TRUE on first deploy, FALSE on subsequent ones.
#
# Nixpacks runs phases from the app root (the directory containing this
# file — `server/`), so paths here are server-root relative.

[phases.setup]
nixPkgs = ["nodejs_20", "npm-9_x"]

[phases.install]
# Dokploy copies ONLY the server/ folder into the build context, so there
# is no parent repo root to cd into. Install standalone from server/ using
# the committed server/package-lock.json (generated in isolation from
# server/package.json — it is NOT the monorepo workspace lockfile).
cmds = [
  "npm ci --no-audit --no-fund",
]

[phases.build]
# No build step for a plain Node service; `npm ci` already produced
# node_modules. We keep the phase so Nixpacks has a hook for future
# bundling steps (esbuild, tsc, etc.).

[start]
cmd = "npm start"

[env]
PORT = "4000"
HOST = "0.0.0.0"
