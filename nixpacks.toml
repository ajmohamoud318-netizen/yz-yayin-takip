# Nixpacks config for the static SPA (Dokploy app #1).
#
# Builds the Vite SPA from `client/` and serves `client/dist/` via the
# zero-dep `serve.cjs` shim. The repo is a monorepo (`client/` + `server/`)
# — this file focuses on the SPA only. The Fastify API is a separate Dokploy
# app rooted at `server/` (see `server/nixpacks.toml`).
#
# Nixpacks runs phases from the app root (the directory containing this
# file), so paths are repo-root relative, not `client/`.

[phases.setup]
nixPkgs = ["nodejs_20", "npm-9_x"]

[phases.install]
# Install everything so the workspace wiring is in place. The SPA only
# actually needs `client/node_modules`, but `npm ci` at the root sets up
# the npm workspace symlinks that make `client`'s imports resolve.
cmds = ["npm ci --no-audit --no-fund"]

[phases.build]
# Vite builds to client/dist. Output is served by `serve.cjs` at runtime.
cmds = ["npm run build"]

[start]
# The shim at serve.cjs serves static files with the right cache headers
# and falls back to index.html for client-side routes.
cmd = "node serve.cjs"

# Dokploy exposes the listening port via the PORT env var (default 3000).
[env]
PORT = "3000"
HOST = "0.0.0.0"
