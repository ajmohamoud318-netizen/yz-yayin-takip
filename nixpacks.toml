# Nixpacks config for the static SPA (Dokploy app #1).
#
# When a `client/Dockerfile` is committed, Dokploy uses it directly and
# ignores this file. We keep both so that:
#   - Dokploy uses `client/Dockerfile` (deterministic, fixes rollup/npm-ci
#     caching issues; see client/Dockerfile header).
#   - Railway and other Nixpacks-only hosts still work via this file.
#
# Builds the Vite SPA from `client/` and serves `client/dist/` via the
# zero-dep `serve.cjs` shim. The repo is a monorepo (`client/` + `server/`)
# — this file focuses on the SPA only. The Fastify API is a separate Dokploy
# app rooted at `server/` (see `server/nixpacks.toml`).
#
# Nixpacks runs phases from the app root (the directory containing this
# file), so paths are repo-root relative, not `client/`.

[phases.setup]
nixPkgs = ["nodejs_20", "npm-9_x"]

[phases.install]
# Install devDependencies explicitly. Nixpacks defaults to NODE_ENV=production
# during build, which makes `npm ci` skip devDeps — and rollup is a devDep,
# which is what makes `vite build` crash with
# `Cannot find module @rollup/rollup-linux-x64-gnu`. Using `npm install` (not
# `npm ci`) is also intentional: npm's optional-dep handling (npm/cli#4828)
# can drop platform-specific rollup binaries on `npm ci` in workspaces. The
# committed package-lock.json already lists every rollup platform, so
# installs stay deterministic.
cmds = ["npm install --no-audit --no-fund --include=dev"]
[phases.build]
# Vite builds to client/dist. Output is served by `serve.cjs` at runtime.
cmds = ["npm run build"]

[start]
# The shim at serve.cjs serves static files with the right cache headers
# and falls back to index.html for client-side routes.
cmd = "node serve.cjs"

# Dokploy exposes the listening port via the PORT env var (default 3000).
[env]
PORT = "3000"
HOST = "0.0.0.0"
